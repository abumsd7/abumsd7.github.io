<!DOCTYPE html>
<html>

<head>

  <title>{% if page.title %}{{ page.title }} – {{ site.title | default: "Spilled Out!" }}{% else %}{{ site.title | default: "Spilled Out!" }} – {{ site.description }}{% endif %}</title>

  {% include meta.html %}
  {% include collecttags.html %}
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9342601776677720"
    crossorigin="anonymous"></script>
  <link rel="shortcut icon" href="{{ site.baseurl }}/images/favicon.png">
  <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css" />
  <link rel="alternate" type="application/rss+xml" title="{{ site.name }} - {{ site.description }}"
    href="{{ site.baseurl }}/feed.xml" />

  <script>
    (function() {
      var savedTheme = localStorage.getItem('spilledout_theme') || 'emerald';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
</head>

<body>
  <!-- Full-scale vertical sidebar for Desktop -->
  <aside class="desktop-sidebar">
    <div class="sidebar-top">
      <a href="{{ site.baseurl }}/">
        <img class="sidebar-banner-img" src="{{ site.baseurl }}/images/banner_vertical_bw.png" alt="Banner Vertical" />
      </a>
    </div>
    <nav class="sidebar-navbar">
      {% include navbar_links.html %}
    </nav>
  </aside>

  <!-- Mobile Top Sticky Header (Hides on Scroll Down, Shows on Scroll Up) -->
  <header class="mobile-top-header mobile-only" id="mobileTopHeader">
    <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Toggle Navigation Menu">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
    <a href="{{ site.baseurl }}/" class="mobile-header-banner">
      <img src="{{ site.baseurl }}/images/banner_bw.png" alt="Banner" />
    </a>
  </header>

  <!-- Mobile Bottom Navigation Bar -->
  <nav class="mobile-bottom-navbar mobile-only" id="mobileBottomNavbar">
    {% include navbar_links.html %}
  </nav>

  <!-- Mobile Navigation Drawer Overlay (for overflow links) -->
  <div class="mobile-drawer-overlay" id="mobileDrawerOverlay">
    <div class="mobile-drawer-content">
      <div class="mobile-drawer-header">
        <h3>Menu</h3>
        <span class="mobile-drawer-close" id="mobileDrawerClose">&times;</span>
      </div>
      <div class="mobile-drawer-links" id="mobileDrawerLinks"></div>
    </div>
  </div>

  <!-- Floating Scroll Action Button (Go to Top / Go to Bottom) -->
  <button id="floatingScrollBtn" class="floating-scroll-btn scroll-to-bottom" aria-label="Scroll Page">
    <svg class="scroll-icon icon-down" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="6 9 12 15 18 9"></polyline>
    </svg>
    <svg class="scroll-icon icon-up" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
      <polyline points="18 15 12 9 6 15"></polyline>
    </svg>
  </button>

  <div id="main" role="main" class="main-layout-container container">
    {{ content }}
  </div>

  <div class="wrapper-footer">
    <div class="container">
      <footer class="footer">
        <div class="footer-simple-inline">
          <span class="footer-label">written by</span>
          <a href="{{ site.baseurl }}/profile/" class="footer-author">
            <img src="{{ site.avatar }}" class="footer-avatar-circle" alt="{{ site.name }}" />
            <span class="footer-author-name">{{ site.name }}</span>
          </a>
          <button class="footer-share-button" id="footerShareBtn" type="button" aria-label="Share page">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
              <polyline points="16 6 12 2 8 6"></polyline>
              <line x1="12" y1="2" x2="12" y2="15"></line>
            </svg>
            <span id="shareBtnText">Share</span>
          </button>
          <button class="footer-theme-button" id="themePickerTrigger" type="button" aria-label="Choose Theme Palette">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 21a9 9 0 1 1 0-18c4.97 0 9 3.58 9 8a4.5 4.5 0 0 1-7.2 3.6 2 2 0 0 0-2.8 2.4A4.5 4.5 0 0 1 12 21z"></path>
              <circle cx="7.5" cy="10.5" r="1.5" fill="currentColor"></circle>
              <circle cx="12" cy="7.5" r="1.5" fill="currentColor"></circle>
              <circle cx="16.5" cy="10.5" r="1.5" fill="currentColor"></circle>
            </svg>
            <span>Theme</span>
          </button>
        </div>
      </footer>
    </div>
  </div>

  {% include lightbox.html %}
  {% include theme_picker.html %}
  {% include site_scripts.html %}
  {% include analytics.html %}
</body>

</html>
