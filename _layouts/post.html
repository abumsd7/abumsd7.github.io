---
layout: default
---

<article class="post">
  <h1>{{ page.title }}</h1>
  <span>
    {% if page.category %}
    <span class="category_format"><nobr>{{ page.category }}</nobr></span>
    {% endif %}
    {% for tag in page.tags %}
    {% capture tag_name %}{{ tag }}{% endcapture %}
    <a href="{{ site.baseurl }}/tag/{{ tag_name }}"><code class="tag_format"><nobr>{{ tag_name }}</nobr></code></a>
    {% endfor %}
  </span>

  <div class="post-meta-row">
    <div class="date">
      Written on {{ page.date | date: "%B %e, %Y" }}
    </div>
    <span class="post-views-badge" id="postViewsBadge">
      <svg class="views-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
      <span id="postViewsCount">...</span>
    </span>
  </div>

  <div class="entry post-content">
    {{ content }}
  </div>
  {% include giscus.html %}
</article>
